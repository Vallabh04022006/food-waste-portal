
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-waste-deployment
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: food-waste
  template:
    metadata:
      labels:
        app: food-waste
    spec:
      containers:
        - name: food-waste
          image: vallabh04022006/food-waste-portal:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: food-waste-service
spec:
  type: NodePort
  selector:
    app: food-waste
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
